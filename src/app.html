const LIT = new Set('true false null undefined NaN Infinity'.split(' '));
const BUI = new Set('console Math JSON Object Array Promise Map Set Date Number String Boolean Error RegExp Symbol WeakMap structuredClone setTimeout clearTimeout setInterval queueMicrotask'.split(' '));
const TOK = /\/\/[^\n]*|\/\*[\s\S]*?(?:\*\/|$)|`(?:\\[\s\S]|[^`\\])*(?:`|$)|"(?:\\.|[^"\\\n])*(?:"|$)|'(?:\\.|[^'\\\n])*(?:'|$)|\b\d[\d_]*(?:\.\d+)?n?\b|[A-Za-z_$][\w$]*|[\s\S]/g;
function highlight(code, lang) {
  if (lang === 'bash') return code.split('\n').map((l) => (/^\s*#/.test(l) ? '<span class="t-c">' + esc(l) + '</span>' : esc(l))).join('\n');
  if (lang === 'text') return esc(code);
  const ts = lang === 'ts';
  let out = '', m;
  TOK.lastIndex = 0;
  while ((m = TOK.exec(code))) {
    const t = m[0], c = t[0];
    if (c === '/' && (t[1] === '/' || t[1] === '*')) out += '<span class="t-c">' + esc(t) + '</span>';
    else if (c === '`' || c === '"' || c === "'") out += '<span class="t-s">' + esc(t) + '</span>';
    else if (c >= '0' && c <= '9') out += '<span class="t-n">' + esc(t) + '</span>';
    else if (/[A-Za-z_$]/.test(c)) {
      let cls = '';
      if (LIT.has(t)) cls = 't-l';
      else if (KW.has(t) || (ts && TSKW.has(t))) cls = 't-k';
      else if (ts && TYP.has(t)) cls = 't-t';
      else if (BUI.has(t)) cls = 't-b';
      else if (/^[A-Z]/.test(t)) cls = 't-t';
      else if (/^\s*\(/.test(code.substr(TOK.lastIndex, 30))) cls = 't-f';
      out += cls ? '<span class="' + cls + '">' + esc(t) + '</span>' : esc(t);
    } else out += esc(t);
  }
  return out;
}

/* ---------- markdown mínimo ---------- */
function inline(s) {
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
  s = esc(s);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?![*\w])/g, '$1<em>$2</em>');
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => '<code>' + esc(codes[i]) + '</code>');
}
const LABEL = { js: 'JavaScript', ts: 'TypeScript', bash: 'Terminal', json: 'JSON', text: '' };
function md(src, ctx) {
  const L = src.replace(/\r/g, '').split('\n');
  const out = [];
  let i = 0, m;
  const isBlock = (ln) => /^(```|#{1,3}\s|>\s?|\s*[-*]\s|\s*\d+\.\s|\|)/.test(ln);
  while (i < L.length) {
    const ln = L[i];
    if ((m = /^```(\w*)\s*(run)?\s*$/.exec(ln))) {
      const lang = m[1] || 'text', run = !!m[2], buf = [];
      i++;
      while (i < L.length && !/^```\s*$/.test(L[i])) buf.push(L[i++]);
      i++;
      const code = buf.join('\n');
      if (run && ctx) { ctx.runs.push({ code, lang }); out.push('<div class="mini" data-run="' + (ctx.runs.length - 1) + '"></div>'); }
      else out.push('<div class="cb"><div class="cb-bar"><span>' + (LABEL[lang] || '') + '</span><span class="spacer"></span><button class="btn sm ghost" type="button" data-copy>Copiar</button></div><pre class="code"><code>' + highlight(code, lang) + '</code></pre></div>');
      continue;
    }
    if (!ln.trim()) { i++; continue; }
    if ((m = /^(#{1,3})\s+(.*)$/.exec(ln))) { const n = Math.max(2, m[1].length); out.push('<h' + n + '>' + inline(m[2]) + '</h' + n + '>'); i++; continue; }
    if (/^\|/.test(ln) && /^\|[\s:|-]+\|?\s*$/.test(L[i + 1] || '')) {
      const cells = (r) => r.trim().replace(/^\||\|$/g, '').split(/(?<!\\)\|/).map((c) => c.replace(/\\\|/g, '|').trim());
      const head = cells(ln);
      i += 2;
      const rows = [];
      while (i < L.length && /^\|/.test(L[i])) rows.push(cells(L[i++]));
      out.push('<div class="tbl"><table><thead><tr>' + head.map((c) => '<th>' + inline(c) + '</th>').join('') + '</tr></thead><tbody>' + rows.map((r) => '<tr>' + r.map((c) => '<td>' + inline(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>');
      continue;
    }
    if (/^>\s?/.test(ln)) {
      const buf = [];
      while (i < L.length && /^>\s?/.test(L[i])) buf.push(L[i++].replace(/^>\s?/, ''));
      out.push('<blockquote><p>' + inline(buf.join(' ')) + '</p></blockquote>');
      continue;
    }
    if (/^\s*([-*]|\d+\.)\s/.test(ln)) {
      const ord = /^\s*\d+\./.test(ln), items = [];
      while (i < L.length && /^\s*([-*]|\d+\.)\s/.test(L[i])) {
        let t = L[i++].replace(/^\s*([-*]|\d+\.)\s+/, '');
        while (i < L.length && L[i].trim() && /^\s{2,}\S/.test(L[i]) && !/^\s*([-*]|\d+\.)\s/.test(L[i])) t += ' ' + L[i++].trim();
        items.push(t);
      }
      out.push((ord ? '<ol>' : '<ul>') + items.map((t) => '<li>' + inline(t) + '</li>').join('') + (ord ? '</ol>' : '</ul>'));
      continue;
    }
    const buf = [];
    while (i < L.length && L[i].trim() && !(buf.length && isBlock(L[i]))) buf.push(L[i++]);
    out.push('<p>' + inline(buf.join(' ')) + '</p>');
  }
  return out.join('\n');
}

/* ---------- editor de código ---------- */
function makeEditor(host, opt) {
  host.classList.add('ed');
  host.innerHTML = '<div class="ed-scroll"><div class="gut" aria-hidden="true"></div><div class="ed-main"><pre class="hl" aria-hidden="true"></pre><textarea class="ta" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="Editor de código"></textarea></div></div>';
  const ta = $('.ta', host), hl = $('.hl', host), gut = $('.gut', host);
  let errLines = new Set(), timer;
  const paint = () => {
    const v = ta.value;
    hl.innerHTML = highlight(v, opt.lang) + '\n';
    const n = v.split('\n').length;
    let g = '';
    for (let k = 1; k <= n; k++) g += '<div' + (errLines.has(k) ? ' class="err"' : '') + '>' + k + '</div>';
    gut.innerHTML = g;
  };
  ta.value = opt.code;
  paint();
  const ins = (txt) => { if (!document.execCommand('insertText', false, txt)) { const s = ta.selectionStart; ta.setRangeText(txt, s, ta.selectionEnd, 'end'); ta.dispatchEvent(new Event('input', { bubbles: true })); } };
  ta.addEventListener('input', () => { errLines = new Set(); paint(); clearTimeout(timer); timer = setTimeout(() => opt.onInput && opt.onInput(ta.value), 300); });
  ta.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); opt.onSubmit && opt.onSubmit(); return; }
    const v = ta.value, s = ta.selectionStart, en = ta.selectionEnd;
    if (e.key === 'Tab') {
      e.preventDefault();
      if (s === en && !e.shiftKey) { ins('  '); return; }
      const a = v.lastIndexOf('\n', s - 1) + 1;
      const block = v.slice(a, en);
      const next = e.shiftKey ? block.replace(/^ {1,2}/gm, '') : block.replace(/^/gm, '  ');
      ta.setSelectionRange(a, en);
      ins(next);
      ta.setSelectionRange(a, a + next.length);
      return;
    }
    if (e.key === 'Enter' && !e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey) {
      e.preventDefault();
      const ls = v.lastIndexOf('\n', s - 1) + 1;
      const line = v.slice(ls, s);
      const ind = /^[ \t]*/.exec(line)[0];
      const extra = /[{(\[]\s*$/.test(line) ? '  ' : '';
      const p = v[s - 1], n = v[en];
      if ((p === '{' && n === '}') || (p === '[' && n === ']') || (p === '(' && n === ')')) {
        ins('\n' + ind + extra + '\n' + ind);
        const pos = s + 1 + ind.length + extra.length;
        ta.setSelectionRange(pos, pos);
      } else ins('\n' + ind + extra);
    }
  });
  return {
    get value() { return ta.value; },
    set value(v) { ta.value = v; errLines = new Set(); paint(); },
    setErrors(a) { errLines = new Set(a); paint(); },
    focus() { ta.focus(); },
  };
}

    const src = head + code + '\n;\n' + (tests || '') + '\n};\n__runFn(__userFn, { settleMs: ' + settleMs + ' }).then((r) => self.postMessage({ ok: true, r }), (e) => self.postMessage({ ok: false, error: String(e) }));';

    w.onmessage = (ev) => (ev.data.ok ? finish(ev.data.r) : finish({ error: ev.data.error, logs: [], results: [] }));

function outHtml(res, empty) {
  if (res.timeout) return '<div class="line error">O código demorou mais de ' + Math.round((res.limit || 12000) / 1000) + ' segundos e foi interrompido. Provável laço infinito: confira a condição de parada.</div>';
  if (res.syntax) return '<div class="line error">Erro de sintaxe' + (res.line > 0 ? ' (perto da linha ' + res.line + ')' : '') + ': ' + esc(res.error) + '\n→ Confira chaves { }, parênteses ( ), colchetes [ ], aspas e vírgulas.</div>';
  const rows = (res.logs || []).map((l) => '<div class="line ' + l.k + '">' + esc(l.t) + '</div>');
  if (res.error) rows.push('<div class="line error">' + esc(res.error) + '</div>');
  if (!rows.length) rows.push('<div class="line dim">' + esc(empty || '(sem saída)') + '</div>');

}

const PREFACE = 'Você é o professor particular de programação de um aluno brasileiro que está aprendendo JavaScript e TypeScript do zero ao nível profissional, numa plataforma de exercícios. Responda sempre em português do Brasil, com tom de professor paciente e direto, em linguagem acessível a leigos (explique o jargão na primeira vez que usar).\nRegras: (1) Seja conciso: no máximo uns 250 palavras, salvo se o aluno pedir uma explicação longa. (2) NÃO entregue a solução completa do exercício, a não ser que o aluno peça explicitamente a resposta ou já tenha visto a solução; prefira apontar o trecho com problema, explicar o porquê e sugerir o próximo passo. (3) Use trechos curtos de código em blocos markdown. (4) Corrija conceitos errados com gentileza. (5) Quando útil, cite o nome do tópico na documentação (MDN ou TypeScript Handbook) para leitura adicional, sem inventar links. (6) Formate em markdown simples.\n';
function lessonContext(l) {
  const s = st(l.id), code = edApi ? edApi.value : s.code || l.starter, m = modules.find((x) => x.id === l.module);
  let r = 'CONTEXTO\nTrilha: ' + tracks[l.track].nome + ' · Módulo: ' + m.title + ' · Lição: ' + l.title + '\n\nTexto da lição (resumo):\n' + l.body.slice(0, 4500) + '\n';
  if (!l.reading) {
    r += '\nEnunciado do exercício:\n' + l.task + '\n\nCódigo atual do aluno:\n```' + (l.track === 'ts' ? 'ts' : 'js') + '\n' + code.slice(0, 7000) + '\n```\n';
    if (s.last) r += '\nÚltimo resultado dos testes automáticos: ' + s.last.pass + ' de ' + s.last.total + ' passaram.' + (s.last.fails.length ? ' Falhas: ' + s.last.fails.join(' | ') : '') + '\n';
    r += '\nO aluno ' + (s.seen ? 'JÁ viu' : 'ainda NÃO viu') + ' a solução de referência.\nSolução de referência (PRIVADA, use só para avaliar; não revele sem o aluno pedir):\n```\n' + l.solution.slice(0, 5000) + '\n```\n';
  }
  return r;
}
function mountTutor(l, host) {
  const reading = l.reading;
  host.innerHTML = '<div class="card tutor"><h2>Professor Claude <small>corrige seu código e tira dúvidas</small></h2><div class="acts">' +
    (reading ? '' : '<button class="btn primary" type="button" data-t="review">Revisar meu código</button>') +
    '<button class="btn" type="button" data-t="explain">Explicar de outro jeito</button><button class="btn" type="button" data-t="copy">Copiar enunciado e código</button></div>' +
    '<form class="ask"><input type="text" id="tq" placeholder="Pergunte algo sobre esta lição…" aria-label="Sua pergunta ao professor" autocomplete="off"><button class="btn" type="submit">Perguntar</button><button class="btn" type="button" id="tstop" hidden>Parar</button></form>' +
    '<div class="thread" id="th" aria-live="polite"></div><p class="note" id="tnote"></p></div>';
  const th = $('#th', host), note = $('#tnote', host), stop = $('#tstop', host), form = $('.ask', host);
  const hist = (threads[l.id] = threads[l.id] || []);
  const draw = () => { th.innerHTML = hist.map((m) => (m.role === 'user' ? '<div class="msg u">' + esc(m.show || m.content) + '</div>' : '<div class="msg a"><div class="md">' + md(m.content) + '</div></div>')).join(''); };
  draw();
  let ctl = null, sample = null;
  const copyAll = () => {
    const s = st(l.id), code = edApi ? edApi.value : s.code || l.starter;
    const txt = 'Sou aluno da Oficina de Código. Lição: ' + l.title + '.\n\n' + (reading ? 'Tenho uma dúvida sobre esta lição.' : 'Enunciado: ' + l.task + '\n\nMeu código:\n```\n' + code + '\n```\n\nPor favor, revise e me ajude sem entregar a solução pronta.');
    copyText(txt).then((ok) => { note.textContent = ok ? 'Copiado. Cole na conversa com o Claude.' : 'Não consegui copiar automaticamente.'; });
  };
  async function ask(kind, text) {
    if (!sample) return;
    let prompt, show;
    if (kind === 'review') {
      show = 'Revise meu código.';
      prompt = 'Revise o código do aluno para este exercício. Estruture a resposta com estes tópicos em negrito: **O que está certo**, **O que ajustar** (aponte o trecho, explique o porquê, sem entregar a solução pronta), **Boas práticas**, **Desafio extra** (uma variação curta para treinar).' + (l.track === 'desafios' ? ' Inclua uma análise breve de complexidade (Big O).' : '') + (l.track === 'ts' ? ' Comente também a qualidade dos tipos (evitar any, precisão dos tipos).' : '');
    } else if (kind === 'explain') {
      show = 'Explique de outro jeito.';
      prompt = 'Explique o assunto principal desta lição de outro jeito: com uma analogia do dia a dia, depois um exemplo de código diferente do texto e, por fim, um erro comum de iniciantes.';
    } else { show = text; prompt = text; }
    const turns = [{ role: 'user', content: PREFACE + '\n' + lessonContext(l) }];
    hist.slice(-6).forEach((m) => turns.push({ role: m.role, content: m.content }));
    turns.push({ role: 'user', content: prompt });
    hist.push({ role: 'user', content: prompt, show });
    hist.push({ role: 'assistant', content: '' });
    draw();
    const bubble = th.lastElementChild;
    bubble.innerHTML = '<div class="md"><p class="muted">Pensando…</p></div>';
    ctl = new AbortController();
    $$('button', host).forEach((b) => (b.disabled = true)); stop.hidden = false; stop.disabled = false; note.textContent = '';
    try {
      const r = await sample(turns, { cache: false, signal: ctl.signal, onText: ({ text }) => { hist[hist.length - 1].content = text; bubble.innerHTML = '<div class="md">' + md(text) + '</div>'; } });
      hist[hist.length - 1].content = r.text;
      bubble.innerHTML = '<div class="md">' + md(r.text) + '</div>';
      if (r.truncated) note.textContent = 'A resposta foi cortada. Peça para continuar ou pergunte algo mais específico.';
    } catch (e) {
      if (e && e.text) { hist[hist.length - 1].content = e.text; bubble.innerHTML = '<div class="md">' + md(e.text) + '</div>'; }
      else { hist.pop(); hist.pop(); draw(); }
      if (!e || e.code !== 'cancelled') note.textContent = ERR[e && e.code] || 'Não consegui falar com o professor agora.';
      if (e && (e.code === 'not_granted' || e.code === 'sampling_disabled')) sample = null;
    } finally {
      ctl = null; stop.hidden = true;
      $$('button', host).forEach((b) => (b.disabled = !sample && b.dataset.t !== 'copy' ? true : false));
    }
  }
  $$('[data-t]', host).forEach((b) => b.addEventListener('click', () => (b.dataset.t === 'copy' ? copyAll() : ask(b.dataset.t))));
  stop.addEventListener('click', () => ctl && ctl.abort());
  form.addEventListener('submit', (e) => { e.preventDefault(); const q = $('#tq', host).value.trim(); if (!q) return; $('#tq', host).value = ''; ask('free', q); });
  getSample().then((s) => {
    sample = s;
    if (!s) {
      $$('[data-t="review"],[data-t="explain"],.ask', host).forEach((n) => (n.hidden = true));
      note.textContent = 'O professor ao vivo só funciona quando a página é aberta dentro do Claude. Use “Copiar enunciado e código” e cole na conversa para receber a correção.';
    } else note.textContent = 'As respostas usam o seu uso do Claude. O professor enxerga a lição e o código que está no editor.';
  });
}

/* ---------- página de lição ---------- */
function renderLesson(id) {
  const l = byId[id], s = st(id), m = modules.find((x) => x.id === l.module);
  S.last = id; save();
  const arr = lessonsOf(l.track), idx = arr.indexOf(l), prev = arr[idx - 1], next = arr[idx + 1];
  const ctx = { runs: [] };
  const ext = l.track === 'ts' ? 'ts' : 'js', lang = ext;
  view.innerHTML =
    '<article><div class="crumbs"><span class="chip ' + l.track + '">' + tracks[l.track].curto + '</span><span>' + esc(m.title) + '</span><span>·</span><span>' + (l.min || 10) + ' min</span>' + (l.level ? '<span class="stars" style="margin:0" title="Dificuldade">' + '★'.repeat(l.level) + '</span>' : '') + (isDone(id) ? '<span style="color:var(--ok);font-weight:600">Concluída</span>' : '') + '</div>' +
    '<h1>' + esc(l.title) + '</h1>' +
    '<div class="cols' + (l.reading ? ' single' : '') + '"><section class="explain md" id="exp">' + md(l.body, ctx) + (l.reading ? '<div id="readBox" style="margin-top:18px"></div>' : '') + '</section>' +
    (l.reading ? '<section class="work" id="work"></section>' :
    '<section class="work" id="work"><div class="card"><h2>Exercício</h2><div class="md" style="font-size:14.5px"><p style="max-width:none;margin:0">' + inline(l.task) + '</p></div></div>' +
    '<div class="edcard"><div class="ed-top"><span>' + (l.track === 'desafios' ? 'desafio.js' : 'exercicio.' + ext) + '</span><span class="spacer"></span><button class="btn sm ghost" type="button" id="reset">Recomeçar</button></div><div id="ed"></div>' +
    '<div class="actions"><button class="btn primary" type="button" id="verify">' + tick.replace('<svg', '<svg style="width:14px;height:14px"') + ' Verificar <kbd>' + mod + '+↵</kbd></button><button class="btn" type="button" id="run">' + playIc + ' Rodar</button><button class="btn" type="button" id="hint"></button><button class="btn" type="button" id="sol">Ver solução</button></div><div id="conf"></div></div>' +
    '<div id="hints"></div><div id="result"></div></section>') +
    '</div><div id="tutor" style="margin-top:18px;max-width:1100px"></div>' +
    '<nav class="pager"><span>' + (prev ? '<a class="btn" href="#licao-' + prev.id + '">← ' + esc(prev.title) + '</a>' : '') + '</span><span>' + (next ? '<a class="btn" href="#licao-' + next.id + '">' + esc(next.title) + ' →</a>' : '<a class="btn" href="#inicio">Voltar ao início</a>') + '</span></nav></article>';
  mountRuns($('#exp'), ctx);
  mountTutor(l, $('#tutor'));
  edApi = null;
  if (l.reading) { drawReading(l); return; }

  const resEl = $('#result'), conf = $('#conf'), verifyBtn = $('#verify'), runBtn = $('#run');
  edApi = makeEditor($('#ed'), { code: s.code != null ? s.code : l.starter, lang, onInput: (v) => { st(id).code = v; save(); }, onSubmit: () => verify() });
  const busy = (b) => [verifyBtn, runBtn].forEach((x) => (x.disabled = b));
  const drawHints = () => {
    const n = s.hints || 0;
    $('#hint').textContent = n >= l.hints.length ? 'Dicas esgotadas' : 'Pedir dica (' + n + '/' + l.hints.length + ')';
    $('#hint').disabled = n >= l.hints.length;
    $('#hints').innerHTML = n ? '<div class="hint-box"><h2>Dicas</h2><ol>' + l.hints.slice(0, n).map((h) => '<li>' + inline(h) + '</li>').join('') + '</ol></div>' : '';
  };
  drawHints();
  $('#hint').addEventListener('click', () => { s.hints = Math.min((s.hints || 0) + 1, l.hints.length); save(); drawHints(); });
  $('#reset').addEventListener('click', () => {
    conf.innerHTML = '<div class="confirm" style="margin:0 12px 12px"><span>Recomeçar apaga o seu código desta lição.</span><button class="btn sm" type="button" id="y">Recomeçar</button><button class="btn sm ghost" type="button" id="n">Cancelar</button></div>';
    $('#n').onclick = () => (conf.innerHTML = '');
    $('#y').onclick = () => { edApi.value = l.starter; s.code = l.starter; save(); conf.innerHTML = ''; resEl.innerHTML = ''; };
  });
  const showSol = () => {
    s.seen = true; save();
    conf.innerHTML = '<div style="padding:0 12px 12px"><div class="cb" style="margin:0"><div class="cb-bar"><span>Solução de referência</span><span class="spacer"></span><button class="btn sm" type="button" id="use">Usar no editor</button><button class="btn sm ghost" type="button" data-copy>Copiar</button></div><pre class="code"><code>' + highlight(l.solution, lang) + '</code></pre></div><p class="note">Existem outras soluções corretas. Compare com a sua e pergunte ao professor se algo não ficar claro.</p></div>';
    $('#use').onclick = () => { edApi.value = l.solution; s.code = l.solution; save(); };
  };
  $('#sol').addEventListener('click', () => {
    if (s.seen) { showSol(); return; }
    conf.innerHTML = '<div class="confirm" style="margin:0 12px 12px"><span>Ver a solução agora? Tentar mais um pouco costuma ensinar mais.</span><button class="btn sm" type="button" id="y">Mostrar solução</button><button class="btn sm ghost" type="button" id="n">Continuar tentando</button></div>';
    $('#n').onclick = () => (conf.innerHTML = '');
    $('#y').onclick = showSol;
  });
  if (s.seen) { $('#sol').textContent = 'Ver solução de novo'; }

  async function compile(status) {
    const tools = await ensureTS(status);
    const chk = tools.check(edApi.value, l.types);
    return { tools, chk, js: chk.syntax ? null : tools.transpile(edApi.value), jsTests: tools.transpile(l.tests) };
  }
  const tsErrHtml = (chk) => chk.errors.length ? '<div class="sec-t">Erros do compilador</div>' + chk.errors.map((e) => '<div class="row bad"><span class="mk">✗</span><div><strong>Linha ' + e.line + ':</strong> ' + esc(e.msg).replace(/\n/g, '<br>') + '</div></div>').join('') : '';
  const status = (t) => { resEl.innerHTML = '<div class="card res"><div class="res-h run">' + esc(t) + '</div></div>'; };
  const tsFail = (e) => { resEl.innerHTML = '<div class="card res"><div class="res-h bad">Não consegui carregar o compilador TypeScript.</div><div class="res-b"><p>Verifique a conexão e tente de novo. O compilador é baixado de um CDN público na primeira vez.</p></div></div>'; };

  async function doRun() {
    busy(true); status('Executando…');
    try {
      let js = edApi.value, chk = null;
      if (l.track === 'ts') {
        try { const c = await compile(status); chk = c.chk; js = c.js; } catch (e) { tsFail(e); busy(false); return; }
        edApi.setErrors(chk.errors.map((e) => e.line));
      }
      const res = js == null ? { logs: [], error: null } : await execute(js, '', { settleMs: 3000, limit: 12000 });
      resEl.innerHTML = '<div class="card res"><div class="res-h run">Saída do programa</div><div class="out" style="border:0">' + outHtml(res, 'Rodou sem erros e não imprimiu nada. Use console.log(...) para ver valores, ou clique em Verificar.') + '</div>' + (chk && chk.errors.length ? '<div class="res-b">' + tsErrHtml(chk) + '</div>' : '') + '</div>';
    } finally { busy(false); }
  }
  async function verify() {
    busy(true); status('Verificando…');
    try {
      const rows = [];
      let chk = null, js = edApi.value, jsTests = l.tests, res;
      if (l.track === 'ts') {
        try { const c = await compile(status); chk = c.chk; js = c.js; jsTests = c.jsTests; } catch (e) { tsFail(e); return; }
        edApi.setErrors(chk.errors.map((e) => e.line));
        if (chk.syntax) { s.tries = (s.tries || 0) + 1; save(); resEl.innerHTML = '<div class="card res"><div class="res-h bad">Há erro de sintaxe no código</div><div class="res-b">' + tsErrHtml(chk) + '</div></div>'; return; }
      }
      status('Rodando os testes…');
      res = await execute(js, jsTests, { settleMs: 400, limit: 40000 });
      (res.results || []).forEach((r) => rows.push({ ok: r.ok, name: r.name, msg: r.msg }));
      if (chk && chk.types) chk.types.forEach((t) => rows.push({ ok: t.ok, name: t.name, msg: t.ok ? '' : tsFriendly(t.msg), type: true }));
      const typeErr = chk ? chk.errors.length : 0;
      const pass = rows.filter((r) => r.ok).length;
      const all = rows.length > 0 && pass === rows.length && !res.error && !res.timeout && !res.syntax && typeErr === 0;
      s.tries = (s.tries || 0) + 1;
      s.last = { pass, total: rows.length, fails: rows.filter((r) => !r.ok).slice(0, 4).map((r) => r.name + (r.msg ? ' → ' + r.msg.split('\n').slice(0, 2).join(' ') : '')) };
      const firstTime = all && !s.done;
      if (all) { s.done = true; s.t = Date.now(); }
      save(); renderSide();
      const head = all ? '<div class="res-h ok">' + tick.replace('<svg', '<svg style="width:16px;height:16px"') + ' Todos os testes passaram (' + pass + '/' + rows.length + ')</div>' : '<div class="res-h bad">' + pass + ' de ' + rows.length + ' testes passaram' + (typeErr ? ' · ' + typeErr + ' erro(s) de tipo' : '') + '</div>';
      let body = '';
      if (res.timeout || res.syntax || res.error) body += '<div class="sec-t">Erro na execução</div><div class="out" style="border:1px solid var(--line);border-radius:8px">' + outHtml(res) + '</div>';
      body += tsErrHtml(chk || { errors: [] });
      if (rows.length) body += '<div class="sec-t">Testes</div>' + rows.map((r) => '<div class="row ' + (r.ok ? 'ok' : 'bad') + '"><span class="mk">' + (r.ok ? '✓' : '✗') + '</span><div>' + (r.type ? '<span class="tag">tipo</span>' : '') + esc(r.name) + (r.ok ? '' : '<pre>' + esc(r.msg) + '</pre>') + '</div></div>').join('');
      const logs = (res.logs || []);
      if (logs.length) body += '<div class="sec-t">Saída do console</div><div class="out" style="border:1px solid var(--line);border-radius:8px">' + outHtml({ logs }) + '</div>';
      let banner = '';
      if (all) {
        const mArr = lessons.filter((x) => x.module === l.module), modDone = mArr.every((x) => isDone(x.id));
        banner = '<div class="banner" style="margin-top:12px"><span>' + (firstTime && modDone ? 'Módulo “' + esc(m.title) + '” concluído!' : 'Lição concluída' + (s.seen ? ' (com a solução à vista)' : '') + '.') + '</span>' + (next ? '<a class="btn primary" href="#licao-' + next.id + '">Próxima: ' + esc(next.title) + ' →</a>' : '<a class="btn primary" href="#inicio">Ver meu progresso</a>') + '<span style="font-weight:400;color:var(--ink)">Quer uma revisão de qualidade? Use “Revisar meu código” abaixo.</span></div>';
      }
      resEl.innerHTML = '<div class="card res">' + head + '<div class="res-b">' + body + '</div></div>' + banner;
    } finally { busy(false); }
  }
  verifyBtn.addEventListener('click', verify);
  runBtn.addEventListener('click', doRun);
}
function drawReading(l) {
  const box = $('#readBox'), next = lessonsOf(l.track)[lessonsOf(l.track).indexOf(l) + 1];
  const paint = () => {
    box.innerHTML = isDone(l.id) ? '<div class="banner"><span>Lição lida.</span>' + (next ? '<a class="btn primary" href="#licao-' + next.id + '">Próxima: ' + esc(next.title) + ' →</a>' : '<a class="btn primary" href="#inicio">Ver meu progresso</a>') + '</div>' : '<button class="btn primary" type="button" id="readBtn">Marcar como lida</button>';
    const b = $('#readBtn');
    if (b) b.addEventListener('click', () => { const s = st(l.id); s.done = true; s.t = Date.now(); save(); renderSide(); paint(); });
  };
  paint();
}

route();
})();
</script>
